version: '3.8'

services:
  form-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    volumes:
      - form_data:/app/data
      - ./app:/app/app
    depends_on:
      - redis
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  form_data:
