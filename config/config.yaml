# Form Backend Configuration

app:
  name: "Form Backend"
  version: "2.0.0"
  debug: false

features:
  - Form handling
  - Email
  - Spam protection
  - Webhooks

tech_stack:
  - FastAPI
  - Jinja2
  - SendGrid
  - reCAPTCHA

server:
  host: "0.0.0.0"
  port: 8000
  workers: 4

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(message)s"
